
spring.application.name=backend

# Configuracion del servidor
server.port=${PORT:8080}

# Base de datos PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cartera_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Configuracion de JPA e Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Documentacion Swagger
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Seguridad JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=3600000

# Configuracion CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Inicializacion de datos
app.seed.enabled=${SEED_ENABLED:false}
app.seed.admin.nombre=${ADMIN_NAME:Administrador de cartera}
app.seed.admin.correo=${ADMIN_EMAIL:}
app.seed.admin.contrasena=${ADMIN_PASSWORD:}